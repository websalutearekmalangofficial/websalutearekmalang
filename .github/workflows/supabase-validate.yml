name: Supabase validation only

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-repo.sh"
      - ".github/workflows/supabase-validate.yml"
      - "package.json"
  push:
    branches:
      - main
      - "chore/supabase-reconciliation-validation"
    paths:
      - "supabase/**"
      - "scripts/validate-supabase-repo.sh"
      - ".github/workflows/supabase-validate.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Supabase sources (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration filenames, project ref, and function sources
        shell: bash
        run: bash scripts/validate-supabase-repo.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies for npm specifier resolution
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in submit-registration send-whatsapp-registration create-registrant-account manage-registrant-account; do
            echo "Checking $fn"
            deno check --node-modules-dir=auto "supabase/functions/$fn/index.ts"
          done

